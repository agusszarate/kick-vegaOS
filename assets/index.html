<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kick-vegaOS</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="stage">
<div id="home">
  <header><div class="logo">kick-vegaOS</div><div class="status" id="status">Cargando…</div></header>
  <div id="rows"></div>
</div>

<div id="player">
  <video id="video" autoplay playsinline></video>
  <div id="msg"></div>
  <div id="osd"><div class="name" id="osdName"></div><div class="title" id="osdTitle"></div>
    <div class="hint" id="osdHint"></div></div>
</div>

<div class="overlay" id="searchBox">
  <h2>Buscar canal</h2>
  <input id="searchInput" type="text" placeholder="Nombre del canal" autocomplete="off">
  <p>Escribí y apretá OK (Enter). Atrás para cancelar.</p>
</div>

<div class="overlay" id="phoneBox">
  <h2>Mandar desde el celular</h2>
  <div id="qr"></div>
  <p>Escaneá el QR con el celular y escribí el nombre del canal o pegá un link de Kick.<br>
    La tele lo abre sola. También podés usar la app <b>ntfy</b> y suscribirte a:</p>
  <code id="topicName"></code>
  <p>Atrás para volver.</p>
</div>

<div id="toast"></div>
</div>

<!-- Built from web/src by `npm run build:web` -->
<script src="app.js"></script>
</body>
</html>
