name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # npm ci also builds the video player (scripts/setup-shaka.sh)
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
